<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-green: #90EE90;
            --dark-bg: #050a05;
        }
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at center, #0a1f0a 0%, #000 100%);
            color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* 1. Login Interface */
        .gateway {
            text-align: center; background: rgba(255,255,255,0.05);
            padding: 40px; border-radius: 20px; border: 1px solid var(--primary-green);
            backdrop-filter: blur(10px); transition: 0.5s; z-index: 10;
        }
        #secret-key {
            background: transparent; border: none; border-bottom: 2px solid var(--primary-green);
            color: var(--primary-green); font-size: 1.5rem; text-align: center;
            margin: 20px 0; outline: none; width: 80%;
        }
        .btn {
            background: var(--primary-green); color: black; border: none;
            padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer;
        }

        /* 2. Main Content Interface */
        #main-content { display: none; text-align: center; animation: fadeIn 1.5s ease-in; width: 90%; }
        
        .bday-title { 
            font-size: 2rem; color: var(--primary-green); 
            text-shadow: 0 0 20px rgba(144, 238, 144, 0.5); 
            margin-bottom: 5px;
        }

        /* 3D Cake Design */
        .cake { position: relative; width: 120px; height: 80px; background: #fdf5e6; border-radius: 10px 10px 0 0; margin: 40px auto; box-shadow: 0 8px var(--primary-green); }
        .cake::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 25px; background: #fff; border-radius: 10px 10px 50% 50%; }
        .candles-box { position: absolute; top: -35px; width: 100%; display: flex; justify-content: center; gap: 8px; }
        .candle { font-size: 30px; cursor: pointer; filter: grayscale(1); transition: 0.3s; }
        .lit { filter: grayscale(0) drop-shadow(0 0 15px gold); transform: scale(1.2); }

        /* Polaroid Image */
        .polaroid { 
            background: #fff; padding: 10px 10px 50px 10px; border-radius: 2px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); position: relative; 
            transform: rotate(2deg); margin: 20px auto; max-width: 280px;
        }
        .baby-pic { width: 100%; height: 280px; object-fit: cover; border: 1px solid #eee; }
        .handwritten { 
            position: absolute; bottom: 10px; width: 100%; left: 0; color: #333; 
            font-family: 'Brush Script MT', cursive; font-size: 1.8rem; text-align: center; 
        }

        /* Floating Stars */
        .star { position: absolute; background: white; border-radius: 50%; animation: float 5s infinite linear; z-index: -1; }
        @keyframes float { from { transform: translateY(100vh); } to { transform: translateY(-10vh); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://raw.githubusercontent.com/AnshulSoni20/Birthday-Web/main/dandelions.mp3" type="audio/mpeg">
    </audio>

    <div id="login-screen" class="gateway">
        <h2 style="color: var(--primary-green);">Access Restricted</h2>
        <p>Enter the secret key to unlock your surprise</p>
        <input type="password" id="secret-key" placeholder="••••">
        <br><button class="btn" onclick="checkKey()">Unlock 🔓</button>
    </div>

    <div id="cake-screen" style="display:none; text-align: center;">
        <h2 style="color: var(--primary-green);">Light the candles...</h2>
        <div class="cake">
            <div class="candles-box">
                <span class="candle" onclick="ignite(this)">🕯️</span>
                <span class="candle" onclick="ignite(this)">🕯️</span>
                <span class="candle" onclick="ignite(this)">🕯️</span>
            </div>
        </div>
        <p style="color: #888;">(Tap each candle)</p>
    </div>

    <div id="main-content">
        <h1 class="bday-title">HAPPY BIRTHDAY!</h1>
        <div class="polaroid">
            <img src="baby.jpg" class="baby-pic">
            <div class="handwritten">ilysmm bhondu! <33</div>
        </div>
        <p style="color: var(--primary-green); margin-top: 10px;">Tap anywhere for more magic</p>
    </div>

    <script>
        // Stars generation
        for (let i = 0; i < 40; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.opacity = Math.random();
            document.body.appendChild(star);
        }

        const music = document.getElementById('bg-music');
        let litCount = 0;

        function checkKey() {
            const key = document.getElementById('secret-key').value.toLowerCase();
            
            // CHANGE YOUR PASSWORD HERE:
            if (key === "iambhondu") { 
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('cake-screen').style.display = 'block';
                
                // Music starts exactly when "Unlock" is clicked
                music.play().catch(e => console.log("Music interaction required"));
            } else {
                alert("Wrong key, try again!");
            }
        }

        function ignite(el) {
            if(!el.classList.contains('lit')) {
                el.classList.add('lit');
                litCount++;
                if(litCount === 3) {
                    setTimeout(() => {
                        confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 }, colors: ['#90EE90', '#ffffff'] });
                        document.getElementById('cake-screen').style.display = 'none';
                        document.getElementById('main-content').style.display = 'block';
                    }, 800);
                }
            }
        }

        // Tap for extra confetti after unlock
        document.addEventListener('click', function() {
            if (document.getElementById('main-content').style.display === 'block') {
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 }, colors: ['#90EE90'] });
            }
        });
    </script>
</body>
</html>
